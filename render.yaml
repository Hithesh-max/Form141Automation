# Render Blueprint Specification for Form 141 Automation Platform
# https://render.com/docs/blueprint-spec

services:
  # 1. Main Unified Web Service (Backend + UI + Worker)
  - type: web
    name: form141-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # Starter plan recommended for Playwright Chromium memory requirements
    region: oregon
    envVars:
      - key: ENV
        value: production
      - key: PORTAL_MODE
        value: real
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: form141-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: form141-redis
          property: connectionString

  # 2. Redis Key-Value Store for Queuing & Pub/Sub
  - type: redis
    name: form141-redis
    region: oregon
    plan: starter
    ipAllowList: []

databases:
  # 3. Managed PostgreSQL Database
  - name: form141-db
    region: oregon
    plan: starter
    databaseName: form141
    user: admin
