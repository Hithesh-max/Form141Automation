# Render Blueprint - Free Plan Compatible
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: form141-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: ENV
        value: production
      - key: PORTAL_MODE
        value: real
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_MASTER_KEY
        value: Nt2FDh26fcarOyx4pF48qLbNafloz4fmG2TeAZJCsxU=
      - key: DATABASE_URL
        value: sqlite:///./form141.db
      - key: REDIS_URL
        value: redis://127.0.0.1:6379/0
